<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integration Pattern Accelerator</title>
<style>
:root {
  --primary: #4f46e5; --primary-hover: #4338ca; --primary-light: #eef2ff;
  --success: #059669; --success-bg: #ecfdf5;
  --error: #dc2626; --error-bg: #fef2f2;
  --bg: #f8fafc; --surface: #ffffff; --surface-alt: #f1f5f9;
  --text: #0f172a; --text-sec: #475569; --text-muted: #94a3b8;
  --border: #e2e8f0; --border-focus: #a5b4fc;
  --radius: 12px; --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

/* Layout */
.app-header { background: linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%); color: #fff; padding: 24px 0; text-align: center; }
.app-header h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.02em; }
.app-header p { color: rgba(255,255,255,.8); margin-top: 4px; font-size: .95rem; }
.container { max-width: 960px; margin: 0 auto; padding: 32px 24px; }

/* Pattern Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill,minmax(340px,1fr)); gap: 20px; margin-top: 28px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; cursor: pointer; transition: all .2s ease; position: relative; overflow: hidden; }
.card:hover { border-color: var(--primary); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.card-icon { font-size: 2.5rem; margin-bottom: 12px; }
.card h3 { font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; }
.card .desc { color: var(--text-sec); font-size: .875rem; margin-bottom: 16px; }
.card .meta { display: flex; gap: 16px; font-size: .8rem; color: var(--text-muted); }
.card .meta span { display: flex; align-items: center; gap: 4px; }
.card .arrow { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); font-size: 1.2rem; color: var(--text-muted); transition: .2s; }
.card:hover .arrow { color: var(--primary); right: 20px; }
.card .details { list-style: none; margin-top: 12px; padding: 0; }
.card .details li { font-size: .82rem; color: var(--text-sec); padding: 3px 0; padding-left: 18px; position: relative; }
.card .details li::before { content: '\2713'; position: absolute; left: 0; color: var(--success); font-weight: 600; }

/* Form */
.back-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 18px; cursor: pointer; font-size: .875rem; color: var(--text-sec); transition: .15s; margin-bottom: 20px; }
.back-btn:hover { border-color: var(--primary); color: var(--primary); }
.form-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
.section { margin-bottom: 28px; }
.section-label { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--primary); margin-bottom: 14px; padding-bottom: 6px; border-bottom: 2px solid var(--primary-light); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: .82rem; font-weight: 500; color: var(--text-sec); }
.field input, .field select, .field textarea { padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: .9rem; font-family: inherit; background: var(--surface); transition: border-color .15s; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
.field textarea { resize: vertical; min-height: 80px; }
.field .hint { font-size: .72rem; color: var(--text-muted); }

/* File upload */
.upload-area { border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 24px; text-align: center; cursor: pointer; transition: .15s; background: var(--surface-alt); }
.upload-area:hover { border-color: var(--primary); background: var(--primary-light); }
.upload-area.has-file { border-color: var(--success); background: var(--success-bg); }
.upload-area p { font-size: .85rem; color: var(--text-sec); }
.upload-area .formats { font-size: .72rem; color: var(--text-muted); margin-top: 4px; }

/* Buttons */
.btn-primary { background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm); padding: 14px 32px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: .15s; width: 100%; margin-top: 8px; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }
.btn-outline { background: var(--surface); color: var(--primary); border: 1px solid var(--primary); border-radius: var(--radius-sm); padding: 10px 24px; font-size: .9rem; cursor: pointer; transition: .15s; }
.btn-outline:hover { background: var(--primary-light); }

/* Progress overlay */
.progress-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.6); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
.progress-card { background: var(--surface); border-radius: var(--radius); padding: 40px 48px; text-align: center; min-width: 400px; box-shadow: var(--shadow-lg); }
.progress-card h3 { font-size: 1.1rem; margin-bottom: 20px; }
.progress-bar-bg { width: 100%; height: 8px; background: var(--surface-alt); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg,#4f46e5,#7c3aed); border-radius: 4px; transition: width .4s ease; }
.progress-msg { font-size: .875rem; color: var(--text-sec); }

/* Results */
.result-banner { background: var(--success-bg); border: 1px solid #a7f3d0; border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px; }
.result-banner h3 { color: var(--success); font-size: 1.05rem; margin-bottom: 4px; }
.result-banner p { color: var(--text-sec); font-size: .875rem; }
.result-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
.result-section-header { padding: 14px 20px; font-weight: 600; font-size: .9rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--surface-alt); border-bottom: 1px solid var(--border); }
.result-section-header:hover { background: var(--primary-light); }
.result-section-body { padding: 16px 20px; }
.artifact-list { list-style: none; padding: 0; }
.artifact-list li { padding: 8px 0; border-bottom: 1px solid var(--surface-alt); font-size: .875rem; display: flex; align-items: center; gap: 8px; }
.artifact-list li:last-child { border-bottom: none; }
.prompt-preview { background: var(--surface-alt); border-radius: var(--radius-sm); padding: 16px; max-height: 400px; overflow-y: auto; font-size: .82rem; font-family: 'SF Mono',Monaco,Consolas,monospace; line-height: 1.6; white-space: pre-wrap; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .72rem; font-weight: 600; }
.tag-llm { background: #ede9fe; color: #6d28d9; }
.tag-fallback { background: #fef3c7; color: #b45309; }
.error-box { background: var(--error-bg); border: 1px solid #fca5a5; border-radius: var(--radius); padding: 16px 20px; color: var(--error); margin-top: 16px; font-size: .875rem; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 40px; height: 40px; border: 3px solid var(--surface-alt); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-type="module" src="/static/app.jsx"></script>
</body>
</html>
