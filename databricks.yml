bundle:
  name: integ-pattern-react

include:
  - resources/*.yml

# UC catalog/schema the app writes integration packages + volumes into.
# Override per-target (or with `--var`). The app UI also lets users pick a
# catalog/schema at runtime; these are just the defaults.
variables:
  catalog:
    description: UC catalog the app writes integration packages into.
    default: main
  schema:
    description: UC schema (under the catalog) for the app's volumes.
    default: integration_pattern

# Authentication is NOT hardcoded here so anyone can deploy to their own
# workspace. Pick the target workspace with the CLI, e.g.:
#   databricks bundle deploy -t dev -p <your-profile>
# or set DATABRICKS_CONFIG_PROFILE / DATABRICKS_HOST + DATABRICKS_TOKEN.
targets:
  dev:
    default: true
    mode: development
    # In development mode resources are isolated per user.
    variables:
      catalog: main
      schema: integration_pattern

  prod:
    mode: production
    workspace:
      # Portable per-user path so only one copy is deployed.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: integration_pattern
